
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Fiction</title>
    <style>
        /* 전체 화면 및 배경 스타일 */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        /* 스마트폰 목업 프레임 */
        .phone-frame {
            width: 390px;
            height: 844px;
            background: #000;
            border-radius: 50px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
            border: 12px solid #333;
        }

        /* 잠금화면 배경 이미지 영역 */
        .lockscreen {
            width: 100%;
            height: 100%;
            position: relative;
            /* 배경 이미지 (예시 경로) */
            background: url('https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 20px 40px 20px;
            box-sizing: border-box;
        }

        /* 상단 상태바 & 시계 */
        .status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
        }

        .clock-container {
            text-align: center;
            margin-top: 20px;
        }

        .date {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .time {
            font-size: 76px;
            font-weight: 700;
            letter-spacing: -2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* 하단 잠금 해제 및 버튼 영역 */
        .bottom-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .quick-buttons {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
        }

        .icon-btn {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .unlock-text {
            font-size: 14px;
            opacity: 0.8;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-5px);}
            60% {transform: translateY(-3px);}
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="lockscreen">
            <!-- 상단 바 및 시계 -->
            <div>
                <div class="status-bar">
                    <span>11:47</span>
                    <span>📶 🛜 🔋</span>
                </div>
                <div class="clock-container">
                    <div class="date">10월 24일 토요일</div>
                    <div class="time">11:47</div>
                </div>
            </div>

            <!-- 하단 빠른 실행 버튼 및 잠금 해제 문구 -->
            <div class="bottom-section">
                <div class="quick-buttons">
                    <div class="icon-btn">🔦</div>
                    <div class="icon-btn">📷</div>
                </div>
                <div class="unlock-text">위로 쓸어올려서 잠금 해제</div>
            </div>
        </div>
    </div>

    <script>
        // 간단한 인터랙션 예시 (화면 클릭 시 콘솔 출력 또는 추후 대화창 전환 기능 추가 가능)
        document.querySelector('.lockscreen').addEventListener('click', () => {
            console.log("잠금화면이 터치되었습니다. 다음 스토리로 넘어가거나 암호 입력창을 띄울 수 있습니다.");
        });
    </script>

</body>
</html>
